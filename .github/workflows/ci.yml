name: ci

on:
    push:
        branches:
            - master
            - develop
            - ci
            - "release/v*"
        tags:
            - "v*"
    pull_request:
        branches:
            - master

permissions:
    contents: read

jobs:
    nix-matrix:
        runs-on: ubuntu-latest
        outputs:
            matrix: ${{ steps.set-matrix.outputs.matrix }}
        steps:
            -   uses: actions/checkout@v7
            -   uses: cachix/install-nix-action@v31
            -   name: Cache Nix store for matrix generation
                uses: nix-community/cache-nix-action@v7
                with:
                    primary-key: nix-matrix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'nix/**', '.github/workflows/ci.yml') }}
                    restore-prefixes-first-match: nix-matrix-${{ runner.os }}-${{ runner.arch }}-
            -   id: set-matrix
                name: Generate Nix Matrix
                run: |
                    set -Eeu
                    matrix="$(nix eval --json '.#githubActions.matrix')"
                    echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

    nix:
        name: "nix (${{ matrix.name }})"
        runs-on: ${{ matrix.os }}
        needs: nix-matrix
        strategy:
            fail-fast: false
            matrix: ${{fromJSON(needs.nix-matrix.outputs.matrix)}}
        steps:
            -   uses: actions/checkout@v7

            -   uses: cachix/install-nix-action@v31
                with:
                    nix_path: nixpkgs=channel:nixos-26.05
                    extra_nix_config: "system-features = nixos-test benchmark big-parallel kvm"

            -   name: Cache Nix store for build target
                uses: nix-community/cache-nix-action@v7
                with:
                    # Separate matrix targets so concurrent jobs can save their own dependencies.
                    primary-key: nix-build-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ hashFiles('**/*.nix', '**/flake.lock', 'nix/**', '.github/workflows/ci.yml') }}
                    restore-prefixes-first-match: nix-build-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-

            -   name: Use nix-phps Binary Cache
                uses: cachix/cachix-action@v17
                with:
                    name: fossar
                    skipPush: true

            -   run: nix build -L ".#${{ matrix.attr }}"

            -   name: Upload coverage reports to Codecov
                if: matrix.coverage
                uses: codecov/codecov-action@v7
                with:
                    files: result/coverage.info
                    token: ${{ secrets.CODECOV_TOKEN }}
                    slug: jbboehr/php-stemmer

            -   name: Coveralls
                if: matrix.coverage
                uses: coverallsapp/github-action@v2
                continue-on-error: true
                with:
                    file: result/coverage.info
                    format: lcov

            -   uses: actions/upload-artifact@v7
                if: matrix.release
                with:
                    name: ${{ matrix.artifact }}
                    path: |
                        result/*.zip
                        result/test/run-tests.php
                    if-no-files-found: error
                    retention-days: 14
                    overwrite: true

    native-unix:
        name: "Native ${{ matrix.platform }} | PHP 8.5"
        needs: nix
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: ubuntu-24.04, platform: linux, artifact-path: artifacts }
                    - { os: macos-15, platform: darwin, artifact-path: artifacts/pie-8.5-darwin }
        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              if: matrix.platform == 'darwin'
              with:
                  php-version: '8.5'
                  coverage: none
            - uses: actions/download-artifact@v8
              with:
                  pattern: pie-8.5-${{ matrix.platform }}*
                  # Single-artifact downloads extract directly into this path.
                  path: ${{ matrix.artifact-path }}
            - name: Test extracted release archives
              run: |
                  for artifact in artifacts/pie-8.5-*; do
                      platform="${artifact##*/pie-8.5-}"
                      bash .github/scripts/test-release.sh "$artifact" 8.5 "$platform"
                  done

    native-windows:
        name: "Native Windows | PHP 8.5 | NTS and ZTS"
        needs: nix
        runs-on: windows-latest
        env:
            NO_INTERACTION: 1
            REPORT_EXIT_STATUS: 1
        steps:
            - uses: actions/checkout@v7
            - uses: actions/download-artifact@v8
              with:
                  pattern: pie-8.5-windows-*
                  path: artifacts
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none
              env:
                  phpts: nts
            - name: Test NTS archive
              shell: pwsh
              run: .github/scripts/test-release.ps1 artifacts/pie-8.5-windows-nts nts
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  coverage: none
              env:
                  phpts: ts
            - name: Test ZTS archive
              shell: pwsh
              run: .github/scripts/test-release.ps1 artifacts/pie-8.5-windows-ts ts

    docker:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                PHP_VERSION:
                    - "8.1"
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
                DOCKER_NAME:
                    - debian
        steps:
            -   uses: actions/checkout@v7
            -   uses: docker/setup-buildx-action@v4
            -   uses: docker/build-push-action@v7
                name: Build Docker Image
                with:
                    context: .
                    file: .github/php-${{ matrix.DOCKER_NAME }}.Dockerfile
                    cache-from: type=gha,scope=${{ matrix.DOCKER_NAME }}-${{ matrix.PHP_VERSION }}
                    cache-to: type=gha,mode=max,scope=${{ matrix.DOCKER_NAME }}-${{ matrix.PHP_VERSION }}
                    build-args: PHP_VERSION=${{ matrix.PHP_VERSION }}
                    load: true
                    tags: php-stemmer-${{ matrix.DOCKER_NAME }}
            -   name: Run Docker Tests
                env:
                    DOCKER_NAME: ${{ matrix.DOCKER_NAME }}
                run: bash ./.github/scripts/docker.sh

    docker-fedora:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                DOCKER_NAME:
                    - fedora
        steps:
            -   uses: actions/checkout@v7
            -   uses: docker/setup-buildx-action@v4
            -   uses: docker/build-push-action@v7
                name: Build Docker Image
                with:
                    context: .
                    file: .github/php-${{ matrix.DOCKER_NAME }}.Dockerfile
                    cache-from: type=gha,scope=${{ matrix.DOCKER_NAME }}
                    cache-to: type=gha,mode=max,scope=${{ matrix.DOCKER_NAME }}
                    load: true
                    tags: php-stemmer-${{ matrix.DOCKER_NAME }}
            -   name: Run Docker Tests
                env:
                    DOCKER_NAME: ${{ matrix.DOCKER_NAME }}
                    TEST_PHP_EXECUTABLE: /usr/bin/php
                run: bash ./.github/scripts/docker.sh

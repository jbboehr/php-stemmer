name: Release

on:
    workflow_call:

permissions:
    contents: read

jobs:
    draft:
        if: >-
            github.event_name == 'push' &&
            (startsWith(github.ref, 'refs/tags/v') ||
             startsWith(github.ref, 'refs/heads/release/v'))
        concurrency:
            group: draft-release
            cancel-in-progress: false
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}
            REF_NAME: ${{ github.ref_name }}
            CI_SHA: ${{ github.sha }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - name: Check the release ref and extension version
              run: |
                  [[ "$REF_NAME" =~ ^(release/)?v[0-9]+\.[0-9]+\.[0-9]+$ ]]
                  TAG=${REF_NAME#release/}
                  version=$(sed -n 's/^#define PHP_STEMMER_VERSION "\([^"]*\)"/\1/p' php_stemmer.h)
                  test "$TAG" = "v$version"
                  ref="refs/tags/$TAG"
                  if [[ "$REF_NAME" == release/* ]]; then
                    ref="refs/heads/$REF_NAME"
                  fi
                  git fetch --depth=1 origin "$ref"
                  test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$CI_SHA"
                  echo "TAG=$TAG" >> "$GITHUB_ENV"
            - uses: actions/download-artifact@v8
              with:
                  pattern: pie-*
                  path: artifacts
                  merge-multiple: true
            - name: Draft the release with the tested archives
              working-directory: artifacts
              run: |
                  sha256sum ./*.zip > SHA256SUMS
                  draft=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
                    --jq ".[] | select(.tag_name == \"$TAG\") | .draft")
                  case "$draft" in
                    false) echo "$TAG is already published"; exit 0 ;;
                    "") ;;
                    *) echo "Delete the existing $TAG draft before recreating it" >&2; exit 1 ;;
                  esac
                  if [[ "$REF_NAME" == release/* ]]; then
                    tag_ref=$(git ls-remote --tags origin "refs/tags/$TAG")
                    test -z "$tag_ref"
                  fi
                  gh release create "$TAG" ./*.zip SHA256SUMS --draft --target "$CI_SHA" --generate-notes --repo "$GITHUB_REPOSITORY"
